<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d0c">
  <meta name="description" content="echo sculk">
  <title>echo sculk</title>
  <link rel="icon" type="image/png" href="./sculk.png">
  <style>
    :root {
      color-scheme: dark;
      --ink: #fff;
      --ink-2: #024050;
      --ink-3: #4FF8FF;
      font-family: "JetBrains Mono", "Courier New", monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #080d0c url("./sculk.png") center center / cover no-repeat fixed;
      isolation: isolate;
    }

    /* Небольшое затемнение сохраняет читаемость текста поверх фона. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(135deg, rgb(0 0 0 / 24%), rgb(0 0 0 / 38%));
    }

    main {
      width: 100%;
      display: grid;
      place-items: center;
      padding: 24px 5vw 100px;
    }

    /* Центральный шифр: немного крупнее, чем в предыдущей версии. */
    .fx-focus {
      width: min(1050px, 90vw);
      margin: 0;
      color: var(--ink);
      text-align: center;
      font: 600 clamp(11px, 1.2vw, 16px) / 1.8 "JetBrains Mono", "Courier New", monospace;
      letter-spacing: .075em;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      cursor: default;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      text-shadow: 0 1px 10px rgb(0 0 0 / 58%);
    }

    /* Медленная волна расфокусировки: большая часть строки остаётся читаемой. */
    .fx-focus b {
      font-weight: inherit;
      display: inline-block;
      animation: fx-focus 7s ease-in-out infinite;
      animation-delay: calc(var(--i) * .09s);
      will-change: filter, opacity;
    }

    @keyframes fx-focus {
      0%, 100% { filter: blur(0); opacity: 1; }
      50%      { filter: blur(3px); opacity: .58; }
    }

    /* Нижний шифр: размер сохранён, Vapor Trail + отдельный Lens-Drift для символов. */
    .fx-vapor {
      position: fixed;
      left: 50%;
      bottom: clamp(28px, 7vh, 72px);
      transform: translateX(-50%);
      isolation: isolate;
      max-width: 90vw;
      white-space: nowrap;
      font: 600 clamp(13px, 1.65vw, 21px) / 1.2 "JetBrains Mono", "Courier New", monospace;
      letter-spacing: .13em;
      color: var(--ink);
      text-align: center;
      text-shadow: 0 0 12px rgb(255 255 255 / 30%);
      user-select: none;
      pointer-events: none;
      animation: fx-vapor-main 2.8s ease-in-out infinite;
    }

    .fx-vapor-text {
      position: relative;
      z-index: 1;
      display: inline-block;
    }

    .fx-vapor-text b {
      display: inline-block;
      font-weight: inherit;
      animation: fx-focus-bottom 4.8s ease-in-out infinite;
      animation-delay: calc(var(--i) * .11s);
      will-change: filter, opacity;
    }

    .fx-vapor::before,
    .fx-vapor::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      white-space: inherit;
      font: inherit;
      letter-spacing: inherit;
      filter: blur(2px);
      opacity: .62;
    }

    .fx-vapor::before {
      color: var(--ink-2);
      animation: fx-vapor-a 2.8s ease-in-out infinite;
    }

    .fx-vapor::after {
      color: var(--ink-3);
      animation: fx-vapor-b 2.8s ease-in-out infinite;
    }

    @keyframes fx-vapor-main {
      0%, 100% { translate: -3px 0; }
      50%      { translate: 3px 0; }
    }

    @keyframes fx-vapor-a {
      0%, 100% { transform: translate(-10px, 6px) scaleX(1.08); opacity: .22; }
      50%      { transform: translate(-18px, -4px) scaleX(1.22); opacity: .58; }
    }

    @keyframes fx-vapor-b {
      0%, 100% { transform: translate(10px, -5px) scaleX(1.08); opacity: .2; }
      50%      { transform: translate(18px, 5px) scaleX(1.2); opacity: .56; }
    }

    @keyframes fx-focus-bottom {
      0%, 100% { filter: blur(0); opacity: 1; }
      50%      { filter: blur(5px); opacity: .48; }
    }

    @media (max-width: 520px) {
      main { padding-bottom: 115px; }
      .fx-vapor { letter-spacing: .07em; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fx-focus b,
      .fx-vapor,
      .fx-vapor::before,
      .fx-vapor::after,
      .fx-vapor-text b {
        animation: none;
        filter: none;
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="fx-focus" id="message" role="img" aria-label="-.- .- - / --- .-. .--. .-. --- ... .--. / . -. / .-.. . - .- .... / .-.- / -.-- .-.. .- - .-. --- .--."></p>
  </main>

  <div class="fx-vapor" id="bottom-message" data-text="..--- ....- -.... ...-- / --... ----- / -....- ...-- .---- ----." role="img" aria-label="..--- ....- -.... ...-- / --... ----- / -....- ...-- .---- ----.">
    <span class="fx-vapor-text" aria-hidden="true"></span>
  </div>

  <script>
    const cipher = "-.- .- - / --- .-. .--. .-. --- ... .--. / . -. / .-.. . - .- .... / .-.- / -.-- .-.. .- - .-. --- .--.";
    const bottomCipher = "..--- ....- -.... ...-- / --... ----- / -....- ...-- .---- ----.";

    function fillWithAnimatedCharacters(container, text) {
      let index = 0;

      for (const character of text) {
        if (character === " ") {
          container.appendChild(document.createTextNode(" "));
          continue;
        }

        const symbol = document.createElement("b");
        symbol.textContent = character;
        symbol.setAttribute("aria-hidden", "true");
        symbol.style.setProperty("--i", index++);
        container.appendChild(symbol);
      }
    }

    fillWithAnimatedCharacters(document.getElementById("message"), cipher);
    fillWithAnimatedCharacters(document.querySelector(".fx-vapor-text"), bottomCipher);
  </script>
</body>
</html>
